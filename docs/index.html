<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F172A">
<title>내 투자자산</title>
<style>
.uplot, .uplot *, .uplot *::before, .uplot *::after {box-sizing: border-box;}.uplot {font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";line-height: 1.5;width: min-content;}.u-title {text-align: center;font-size: 18px;font-weight: bold;}.u-wrap {position: relative;user-select: none;}.u-over, .u-under {position: absolute;}.u-under {overflow: hidden;}.uplot canvas {display: block;position: relative;width: 100%;height: 100%;}.u-axis {position: absolute;}.u-legend {font-size: 14px;margin: auto;text-align: center;}.u-inline {display: block;}.u-inline * {display: inline-block;}.u-inline tr {margin-right: 16px;}.u-legend th {font-weight: 600;}.u-legend th > * {vertical-align: middle;display: inline-block;}.u-legend .u-marker {width: 1em;height: 1em;margin-right: 4px;background-clip: padding-box !important;}.u-inline.u-live th::after {content: ":";vertical-align: middle;}.u-inline:not(.u-live) .u-value {display: none;}.u-series > * {padding: 4px;}.u-series th {cursor: pointer;}.u-legend .u-off > * {opacity: 0.3;}.u-select {background: rgba(0,0,0,0.07);position: absolute;pointer-events: none;}.u-cursor-x, .u-cursor-y {position: absolute;left: 0;top: 0;pointer-events: none;will-change: transform;}.u-hz .u-cursor-x, .u-vt .u-cursor-y {height: 100%;border-right: 1px dashed #607D8B;}.u-hz .u-cursor-y, .u-vt .u-cursor-x {width: 100%;border-bottom: 1px dashed #607D8B;}.u-cursor-pt {position: absolute;top: 0;left: 0;border-radius: 50%;border: 0 solid;pointer-events: none;will-change: transform;/*this has to be !important since we set inline "background" shorthand */background-clip: padding-box !important;}.u-axis.u-off, .u-select.u-off, .u-cursor-x.u-off, .u-cursor-y.u-off, .u-cursor-pt.u-off {display: none;}
:root{--bg:#F1F5F9;--card:#fff;--ink:#111827;--sub:#6B7280;--line:#E5E7EB;--track:#E2E8F0;--soft:#F8FAFC;--acc:#34D399;--buy:#EF4444;--sell:#3B82F6;--warn:#F59E0B;--hdr:#0F172A;--chip:#1E293B;--chipink:#94A3B8}
html[data-theme=dark]{--bg:#0B1220;--card:#111C33;--ink:#E5E7EB;--sub:#94A3B8;--line:#22304F;--track:#1E293B;--soft:#0F192E}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;max-width:640px;margin:0 auto;padding-bottom:60px;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
#lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:12px;background:var(--hdr);color:#E2E8F0;max-width:640px;margin:0 auto}
#lock .t{font-size:20px;font-weight:800;color:#fff}
#lock .s{font-size:12px;color:#94A3B8}
#lock input{width:100%;max-width:300px;padding:12px 14px;border-radius:10px;border:1px solid #334155;background:#0B1220;color:#fff;font-size:16px;text-align:center;letter-spacing:.08em}
#lock button{width:100%;max-width:300px;padding:12px;border-radius:10px;border:0;background:var(--acc);color:#0F172A;font-weight:800;font-size:15px;cursor:pointer}
#lock .err{color:#FCA5A5;font-size:12.5px;min-height:18px;text-align:center}
.hdr{position:sticky;top:0;z-index:50;background:var(--hdr)}
.hdr-in{padding:10px 15px 6px}
.hdr-label{font-size:10px;color:#64748B;letter-spacing:.12em;font-weight:600;text-transform:uppercase}
.hdr-row{display:flex;justify-content:space-between;align-items:center;margin-top:2px;gap:8px}
.hdr-title{font-size:18px;font-weight:800;color:#fff}
.hdr-title .n{color:var(--acc)}
.hdr-btns{display:flex;gap:6px}
.hbtn{font-size:11px;color:#94A3B8;border:1px solid #334155;border-radius:6px;padding:3px 9px;background:transparent;cursor:pointer;white-space:nowrap}
.tabs{display:flex;gap:4px;padding:5px 12px 8px;overflow-x:auto}
.tab{flex-shrink:0;padding:5px 12px;border-radius:15px;border:none;cursor:pointer;font-size:12px;font-weight:700;background:var(--chip);color:var(--chipink)}
.tab.on{background:var(--acc);color:#0F172A}
.wrap{padding:10px 13px 0}
.sum{background:linear-gradient(135deg,#1E3A5F,#1D4ED8 160%);border-radius:12px;padding:12px 13px;margin-bottom:12px;color:#DBEAFE}
.sum .tt{font-size:12px;font-weight:800;color:#93C5FD;margin-bottom:7px;line-height:1.5}
.sum-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.sbox{background:rgba(0,0,0,.22);border-radius:7px;padding:7px 9px}
.sbox .l{font-size:9.5px;color:#BFDBFE}.sbox .v{font-size:14px;font-weight:800;margin-top:1px;color:#fff}.sbox .s{font-size:9.5px;color:#DBEAFE;margin-top:1px}
.dist{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:12px;background:rgba(0,0,0,.25);color:#E0F2FE}
.note{font-size:11.5px;color:var(--sub);line-height:1.6;margin:2px 2px 10px}
.warn{background:#FEF3C7;color:#92400E;border-radius:10px;padding:9px 12px;font-size:12px;margin-bottom:10px;line-height:1.5}
html[data-theme=dark] .warn{background:#3B2A0B;color:#FCD34D}
.card{background:var(--card);border-radius:15px;overflow:hidden;margin-bottom:9px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.chead{border-left:4px solid var(--c,#34D399);padding:12px 13px 10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ctop{display:flex;justify-content:space-between;align-items:center;gap:6px}
.cleft{display:flex;gap:8px;align-items:center;min-width:0;flex-wrap:wrap}
.tpill{background:var(--c,#34D399);color:#fff;font-weight:800;font-size:14.5px;padding:4px 8px;border-radius:7px}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:9px;background:#FEF3C7;color:#92400E}
html[data-theme=dark] .badge{background:#3B2A0B;color:#FCD34D}
.pct{font-size:17px;font-weight:800}
.bars{margin:8px 0 6px;display:flex;flex-direction:column;gap:4px}
.bar{height:9px;border-radius:5px;background:var(--track);position:relative;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.mark{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.55}
.key{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:11px;color:var(--sub)}
.key b{display:block;font-size:13px;color:var(--ink);font-weight:700}
.up{color:var(--buy)}.dn{color:var(--sell)}
.cbody{border-top:1px solid var(--line);padding:10px 13px 12px;background:var(--soft)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0;border-bottom:1px dashed var(--line)}
.kv span:first-child{color:var(--sub)}.kv span:last-child{font-weight:700;text-align:right}
.sec{font-size:11.5px;font-weight:800;margin:10px 0 5px;color:var(--ink)}
.tag{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;border-radius:5px;padding:2px 7px;margin-right:6px}
.tag.b{background:var(--buy)}.tag.s{background:var(--sell)}
.ln{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line)}
.ln .l{color:var(--sub)}.ln .r{font-weight:700;font-variant-numeric:tabular-nums}
.sub{display:flex;gap:6px;margin:0 0 10px}
.subtab{font-size:11.5px;font-weight:700;padding:4px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
.subtab.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.day{font-size:11px;font-weight:800;color:var(--sub);margin:12px 2px 4px}
.row{background:var(--card);border-radius:10px;padding:8px 12px;margin-bottom:4px;font-size:12.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.row .m{color:var(--sub);font-size:11px}
.chg{background:var(--card);border-radius:10px;padding:9px 12px;margin-bottom:6px;font-size:12px;line-height:1.6}
.chg .h{font-weight:800}.chg .m{color:var(--sub);font-size:11px}
.foot{margin:18px 14px 0;font-size:11px;color:var(--sub);line-height:1.7;text-align:center}
.empty{color:var(--sub);font-size:12.5px;padding:18px;text-align:center}

.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.dwrap{position:relative;width:130px;height:130px;flex:none}
.donut{width:130px;height:130px;transform:rotate(0deg)}
.dc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.legend{flex:1;min-width:150px;display:flex;flex-direction:column;gap:5px}
.lg{display:flex;align-items:center;gap:6px;font-size:12px}
.lgl{flex:1;color:var(--ink)}.lgv{color:var(--sub);font-variant-numeric:tabular-nums;font-size:11.5px}
a{-webkit-tap-highlight-color:transparent}
.sortRow{display:flex;flex-wrap:wrap;gap:4px;padding:0 2px 8px;align-items:center}
.sortRow .slab{font-size:10.5px;color:var(--sub);font-weight:700;margin-right:2px}
.sbtn{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
.sbtn.on{background:#1E3A8A;border-color:#1E3A8A;color:#fff}.sbtn .ar{margin-left:3px;font-weight:800}
/* ---- Phase 2 (MYPORT-P2-20261105) ---- */
#sumbar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.sb{background:rgba(255,255,255,.06);border-radius:7px;padding:5px 6px;min-width:0;cursor:pointer}
.sb .l{font-size:9px;color:#94A3B8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb .v{font-size:12.5px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb .s{font-size:9.5px;color:#CBD5E1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb .v.up{color:#FCA5A5}.sb .v.dn{color:#93C5FD}
@media (max-width:380px){#sumbar{grid-template-columns:repeat(3,1fr)}}
.stalebar{display:inline-block;margin-left:4px}
/* 배지 통일: 같은 크기·모양, 색만 다름 */
.bdg{display:inline-flex;align-items:center;gap:2px;font-size:10px;font-weight:800;line-height:1;padding:3px 7px;border-radius:9px;white-space:nowrap;vertical-align:middle;border:1px solid transparent}
.bdg.star{background:#FEF3C7;color:#92400E;border-color:#FCD34D}
.bdg.rest{background:#EDE9FE;color:#5B21B6;border-color:#C4B5FD}
.bdg.manual{background:#FFE4E6;color:#9F1239;border-color:#FDA4AF}
.bdg.est{background:#E0F2FE;color:#075985;border-color:#7DD3FC}
.bdg.stale{background:#FFEDD5;color:#9A3412;border-color:#FDBA74}
.bdg.ok{background:#D1FAE5;color:#065F46;border-color:#6EE7B7}
.bdg.mute{background:var(--track);color:var(--sub);border-color:var(--line)}
html[data-theme=dark] .bdg.star{background:#3B2A0B;color:#FCD34D;border-color:#92400E}
html[data-theme=dark] .bdg.rest{background:#2E1065;color:#DDD6FE;border-color:#5B21B6}
html[data-theme=dark] .bdg.manual{background:#4C0519;color:#FECDD3;border-color:#9F1239}
html[data-theme=dark] .bdg.est{background:#082F49;color:#BAE6FD;border-color:#075985}
html[data-theme=dark] .bdg.stale{background:#431407;color:#FED7AA;border-color:#9A3412}
html[data-theme=dark] .bdg.ok{background:#022C22;color:#A7F3D0;border-color:#065F46}
/* 접기·펼치기 섹션 */
.secW{margin-bottom:10px}
.secH{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;padding:8px 4px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.secH .chev{color:var(--sub);font-size:12px}
/* 표(가로 스크롤) */
.hs{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;background:var(--card)}
table.tbl{border-collapse:collapse;font-size:11.5px;min-width:100%;white-space:nowrap}
.tbl th{position:sticky;top:0;background:var(--soft);color:var(--sub);font-weight:700;text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
.tbl th:first-child{background:var(--soft)}
.tbl td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl tr.dim td{opacity:.6}
/* 버튼 줄 */
.pbtns{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 8px}
.pbtn{font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
.pbtn.on{background:#1E3A8A;border-color:#1E3A8A;color:#fff}
/* 차트 */
.chart{background:var(--card);border-radius:12px;padding:6px 4px 2px;margin-bottom:6px;overflow:hidden}
.chart .ct{font-size:11.5px;font-weight:800;padding:2px 8px 4px;display:flex;justify-content:space-between;gap:6px;align-items:center;flex-wrap:wrap}
.legend2{display:flex;flex-wrap:wrap;gap:8px;font-size:10.5px;color:var(--sub);padding:2px 8px 6px}
.legend2 i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:3px}
.legend2 i.d{border-top-style:dashed}
.legend2 b{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:3px}
.uplot{font-family:inherit}.u-legend{display:none}
.u-axis{color:var(--sub)}
/* 막대(HTML) */
.hrow{display:grid;grid-template-columns:62px 1fr 92px;gap:6px;align-items:center;font-size:11.5px;padding:3px 0}
.hrow .hb{height:12px;border-radius:3px;background:var(--track);position:relative;overflow:hidden}
.hrow .hb i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.hrow .hv{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
/* KPI */
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
@media (max-width:420px){.kgrid{grid-template-columns:repeat(2,1fr)}}
.kbox{background:var(--card);border-radius:9px;padding:7px 8px}
.kbox .l{font-size:10px;color:var(--sub)}.kbox .v{font-size:14px;font-weight:800;margin-top:1px}.kbox .s{font-size:10px;color:var(--sub)}
/* 타임라인 */
.tlw{background:var(--card);border-radius:12px;overflow:auto;max-height:640px;-webkit-overflow-scrolling:touch}
.tip{position:fixed;z-index:200;max-width:280px;background:#0F172A;color:#E2E8F0;font-size:11.5px;line-height:1.55;border-radius:8px;padding:8px 10px;box-shadow:0 4px 16px rgba(0,0,0,.35);pointer-events:none}
.amt{cursor:pointer;border-bottom:1px dotted transparent}
.amt:active{border-bottom-color:var(--sub)}
/* [MYPORT-SECTORS-20261112] 섹터 탭 — 인라인 SVG 차트·일지 링크 */
.svw{background:var(--card);border-radius:12px;padding:6px 4px 2px;margin-bottom:4px;overflow:hidden}
.sv{display:block;font-family:inherit}
.jl{font-size:11px;font-weight:700;color:#2563EB;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:2px 8px;white-space:nowrap}
html[data-theme=dark] .jl{color:#93C5FD}
.tabs .tab{min-width:0}
</style>
</head>
<body>
<div id="lock">
  <div class="t">내 투자자산</div>
  <div class="s">열람 전용 · 비밀번호를 입력하세요(처음 한 번만, 이 기기에 저장)</div>
  <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호">
  <button id="go" type="button">열기</button>
  <div class="err" id="err"></div>
</div>
<div id="app" hidden>
  <div class="hdr"><div class="hdr-in">
    <div class="hdr-row"><div class="hdr-title" id="title">내 투자자산</div>
      <div class="hdr-btns"><button class="hbtn" id="cur" type="button">₩ / $</button><button class="hbtn" id="theme" type="button">테마</button><button class="hbtn" id="relock" type="button">잠금</button></div></div>
    <div class="hdr-label" id="asof" style="margin-top:3px;text-transform:none;letter-spacing:0"></div>
    <div id="sumbar"></div>
  </div><div class="tabs" id="tabs"></div></div>
  <div class="wrap" id="view"></div>
  <div class="foot" id="foot"></div>
  <div class="tip" id="tip" hidden></div>
</div>
